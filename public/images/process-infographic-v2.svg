<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">상담부터 마무리까지 진행 절차</title>
  <desc id="desc">문의상담, 현장확인견적, 전문청소, 마무리점검의 네 단계 절차</desc>
  <defs>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082b67" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1200" height="220" rx="16" fill="#ffffff"/>
  <line x1="170" y1="78" x2="1030" y2="78" stroke="#d6e5f5" stroke-width="2"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" filter="url(#soft)">
    <g transform="translate(80 40)">
      <circle cx="90" cy="38" r="33" fill="#ffffff" stroke="#0b65d8" stroke-width="2"/>
      <text x="90" y="45" text-anchor="middle" font-size="17" font-weight="900" fill="#0b65d8">01</text>
      <text x="90" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#082b67">문의·상담</text>
      <text x="90" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#60728c">상황 접수</text>
    </g>
    <g transform="translate(340 40)">
      <circle cx="90" cy="38" r="33" fill="#ffffff" stroke="#0b65d8" stroke-width="2"/>
      <text x="90" y="45" text-anchor="middle" font-size="17" font-weight="900" fill="#0b65d8">02</text>
      <text x="90" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#082b67">현장 확인·견적</text>
      <text x="90" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#60728c">맞춤 견적 안내</text>
    </g>
    <g transform="translate(600 40)">
      <circle cx="90" cy="38" r="33" fill="#ffffff" stroke="#0b65d8" stroke-width="2"/>
      <text x="90" y="45" text-anchor="middle" font-size="17" font-weight="900" fill="#0b65d8">03</text>
      <text x="90" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#082b67">전문 청소</text>
      <text x="90" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#60728c">장비·세제 시공</text>
    </g>
    <g transform="translate(860 40)">
      <circle cx="90" cy="38" r="33" fill="#ffffff" stroke="#0b65d8" stroke-width="2"/>
      <text x="90" y="45" text-anchor="middle" font-size="17" font-weight="900" fill="#0b65d8">04</text>
      <text x="90" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#082b67">마무리 점검</text>
      <text x="90" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#60728c">최종 확인</text>
    </g>
  </g>
  <path d="M292 78h64" stroke="#0b65d8" stroke-width="2" stroke-linecap="round"/>
  <path d="M552 78h64" stroke="#0b65d8" stroke-width="2" stroke-linecap="round"/>
  <path d="M812 78h64" stroke="#0b65d8" stroke-width="2" stroke-linecap="round"/>
</svg>
