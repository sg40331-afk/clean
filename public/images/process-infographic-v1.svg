      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#e8f4ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0878f9"/>
      <stop offset=".35" stop-color="#16b99a"/>
      <stop offset=".7" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#755cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#082b67" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <path d="M106 150 C240 60 350 240 482 150 S720 60 846 150 S1040 240 1094 150" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".95"/>
