<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">상담부터 마무리까지 청소 진행 프로세스</title>
  <desc id="desc">문의 상담, 현장 확인 견적, 전문 청소, 마무리 점검으로 이어지는 네 단계 인포그래픽</desc>
  <defs>
